<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBR Leads — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Ubuntu', 'system-ui', 'sans-serif'] },
          colors: { orange: { 400: '#FF9A4D', 500: '#FB6602', 600: '#D95600' } }
        }
      }
    }
  </script>
  <style>body { background-color: #F4F4F4; font-family: 'Ubuntu', system-ui, sans-serif; }</style>
  <script>
    // Regra: produto externo entra por dentro, não por link (Protocolo de
    // Acoplamento, sbrgestao). Reforço client-side ao gate do middleware
    // (Sec-Fetch-Dest: document) — achado ao vivo num Firefox real que não
    // manda esse header. window.self !== window.top não depende de header.
    // Localhost fica de fora: é desenvolvimento local, não acesso direto em produção.
    if (
      window.self === window.top &&
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1'
    ) {
      window.location.replace('https://gestao.laboratoriosobral.com.br/comercial/demandas/leads')
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-2.5 mb-3">
        <span class="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-lg"
              style="background:linear-gradient(135deg,#FF9A4D,#FB6602);box-shadow:0 2px 8px rgba(251,102,2,0.35)">S</span>
        <span class="text-2xl"><span class="text-[#262626] font-bold tracking-tight">SBR</span> <span class="text-[#6E6E6E] font-light tracking-widest">Leads</span></span>
      </div>
      <p class="text-sm text-[#9A9A9A]">Faça login para continuar</p>
    </div>

    <div class="bg-white rounded-2xl border border-[#E3E3E3] p-8 shadow-sm">
      {% if erro %}
      <div class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-3">
        {{ erro }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[#6E6E6E] mb-1 uppercase tracking-wide">E-mail</label>
          <input type="email" name="email" required autofocus
                 class="w-full rounded-lg bg-white border border-[#E3E3E3] px-3 py-2.5 text-sm text-[#262626] placeholder-[#B3B3B3] focus:outline-none focus:border-orange-500 transition-colors"
                 placeholder="seu@email.com" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#6E6E6E] mb-1 uppercase tracking-wide">Senha</label>
          <input type="password" name="senha" required
                 class="w-full rounded-lg bg-white border border-[#E3E3E3] px-3 py-2.5 text-sm text-[#262626] placeholder-[#B3B3B3] focus:outline-none focus:border-orange-500 transition-colors"
                 placeholder="••••••••" />
        </div>
        <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition-colors mt-2">
          Entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
