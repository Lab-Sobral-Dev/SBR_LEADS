<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SBR Leads{% endblock %}</title>
  {% block head_extra %}{% endblock %}

  <!-- Tailwind CDN: gera CSS dinamicamente, não suporta SRI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
        integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+"
        crossorigin="anonymous" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
          integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr"
          crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            orange: {
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
            },
            surface: {
              900: '#0f0f0f',
              800: '#171717',
              700: '#222222',
              600: '#2e2e2e',
              500: '#3a3a3a',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0f0f0f; color: #e5e5e5; }

    /* Protocolo de Acoplamento (gestao-sbr): embutido em iframe esconde a
       identidade local (marca, nome do usuário, "Sair"), mas NÃO a navegação
       real — os links de <nav> continuam visíveis. `.embutido` é setado por
       script inline no início do <body>, antes de qualquer elemento marcado
       ser pintado, para não piscar. */
    .embutido .oculto-embed { display: none !important; }
    #mapa { height: 460px; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
    select option { background: #222; color: #e5e5e5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #171717; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #f97316; }

    /* Modo expandido do mapa — overlay cobrindo toda a viewport */
    #tabs-container.mapa-expandido {
      position: fixed; inset: 0; z-index: 50; border-radius: 0;
      display: flex; flex-direction: column;
    }
    #tabs-container.mapa-expandido > #abas { flex-shrink: 0; }
    #tabs-container.mapa-expandido #painel-mapa { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #tabs-container.mapa-expandido #mapa { flex: 1; height: auto !important; }

    /* Tooltip do mapa — tema escuro */
    .leaflet-tooltip.pm-tip {
      background: #1c1c1c;
      border: 1px solid #3a3a3a;
      color: #e5e5e5;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      line-height: 1.5;
      box-shadow: 0 4px 20px rgba(0,0,0,.65);
      max-width: 400px;
      white-space: nowrap;
    }
    .leaflet-tooltip.pm-tip.leaflet-tooltip-top::before    { border-top-color:    #3a3a3a; }
    .leaflet-tooltip.pm-tip.leaflet-tooltip-bottom::before { border-bottom-color: #3a3a3a; }
    .leaflet-tooltip.pm-tip.leaflet-tooltip-left::before   { border-left-color:   #3a3a3a; }
    .leaflet-tooltip.pm-tip.leaflet-tooltip-right::before  { border-right-color:  #3a3a3a; }

    /* Cluster do Leaflet — tema laranja, sobrescreve o azul/verde/amarelo padrão */
    .marker-cluster-pm {
      background-color: rgba(249, 115, 22, 0.35);
      border-radius: 50%;
    }
    .marker-cluster-pm div {
      background-color: rgba(249, 115, 22, 0.9);
      width: 30px; height: 30px;
      margin: 5px;
      border-radius: 50%;
      color: #fff;
      font-weight: 600;
      text-align: center;
      line-height: 30px;
      font-size: 12px;
    }
  </style>
</head>
<body class="min-h-screen">
<script>
  // Antes de qualquer elemento marcado `.oculto-embed` ser pintado, pra não
  // piscar. Ver Protocolo de Acoplamento §3 item 4 (gestao-sbr).
  if (window.self !== window.top) {
    document.documentElement.classList.add('embutido')
  } else {
    // Reforço client-side ao gate do middleware (Sec-Fetch-Dest: document) —
    // achado ao vivo num Firefox real que não manda esse header, deixando a
    // tela vazar pra acesso direto. window.self !== window.top não depende
    // de nenhum header.
    window.location.replace('https://gestao.laboratoriosobral.com.br/comercial/demandas/leads')
  }
</script>
{% if user is defined and user %}
  <div class="flex min-h-screen">
    {% include "partials/sidebar.html" %}
    <div class="flex-1 min-w-0 flex flex-col">
      <div class="lg:hidden sticky top-0 z-30 bg-[#0f0f0f] border-b border-[#2e2e2e] flex items-center gap-3 px-4 py-3">
        <button type="button" aria-label="Menu"
                onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')"
                class="text-[#999] text-xl leading-none">&#9776;</button>
        <span class="oculto-embed text-orange-500 font-black tracking-tight">SBR</span>
        <span class="oculto-embed text-white font-light tracking-widest">Leads</span>
      </div>
      <main class="flex-1 p-5">
{% else %}
  <main class="max-w-7xl mx-auto px-5 py-5">
{% endif %}
        {% block content %}{% endblock %}
{% if user is defined and user %}
      </main>
    </div>
  </div>
{% else %}
  </main>
{% endif %}

  {% block scripts %}{% endblock %}
</body>
</html>
